# TLS listener for the agent, which connects from outside the server (task 038).
# The certificate is issued by deploy.sh (issue-certificate.sh) into the
# rabbitmq_tls volume. Core and playback stay on plain 5672 inside the network.
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/tls/ca.crt
ssl_options.certfile = /etc/rabbitmq/tls/server.crt
ssl_options.keyfile = /etc/rabbitmq/tls/server.key
# The agent signs in with a password, not with a client certificate.
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
